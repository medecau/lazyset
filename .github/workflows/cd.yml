name: cd

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    # Lightweight gate — NOT the full CI matrix. The tag is cut from a green
    # main, so this only re-checks SQLite and that the artifact builds cleanly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Optional signed-tag verification (default OFF). Fragile — it needs
      # fetch-depth: 0 on checkout and a reachable public key. Since the only
      # distribution channel is git, the tag *is* the artifact people install,
      # so this is worth more here than it was under Trusted Publishing.
      # Enable by importing the signer's key and uncommenting.
      # - name: Verify signed tag
      #   run: |
      #     gpg --import signer.gpg
      #     git verify-tag "${GITHUB_REF_NAME}"
      - run: uv sync --group dev
      - name: Lint (ruff + ty)
        run: make check
      # `pytest`, not `make test` — the latter goes through `tox -p auto`, which
      # wants an interpreter per env in tox's env_list; the job has exactly one.
      - name: Run SQLite tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: uv run pytest
      - name: Build sdist + wheel
        run: uv build
      # The documented install is `pip install git+…@<tag>`, so the check that
      # matters is that installing this very commit from git imports cleanly.
      # The `@<sha>` is required: actions/checkout leaves a shallow, detached
      # clone with no refs/remotes/origin/HEAD for a bare URL to resolve.
      - name: Smoke-test the git install path
        run: >-
          uv run --no-project
          --with "lazyset @ git+file://${{ github.workspace }}@${{ github.sha }}"
          python -c "import lazyset; print(lazyset.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # No PyPI step: lazyset is not published there (the name is taken by a
      # different project), so the tag plus these attached artifacts are the
      # release. Anything else installs with `pip install git+…@<tag>`.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes dist/*
