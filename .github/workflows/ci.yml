name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Lets the docs be republished without a dummy commit — the Pages deployment
  # API returns a transient 500 often enough to need a manual retry.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev
      - name: Lint (ruff + ty)
        run: make check
      # `pytest`, not `make test`: the matrix already pins one interpreter per
      # job, whereas `make test` loops over the oldest and newest Python itself,
      # so every job would quietly run both instead of the one it was assigned.
      # The matrix is a superset of that loop, and `make check` above lints.
      - name: Run SQLite tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: uv run pytest

  test-databases:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dataset
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql
        env:
          MYSQL_USER: mysql
          MYSQL_PASSWORD: mysql
          MYSQL_DATABASE: dataset
          MYSQL_ROOT_PASSWORD: mysql
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --group dev
      - name: Run PostgreSQL tests
        timeout-minutes: 10
        env:
          DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/dataset"
          PGOPTIONS: "-c lock_timeout=10s -c deadlock_timeout=1s"
        run: uv run pytest
      - name: Configure MySQL lock timeout
        run: |
          mysql -h 127.0.0.1 -P ${{ job.services.mysql.ports['3306'] }} \
            -u root -pmysql \
            -e "SET GLOBAL innodb_lock_wait_timeout=10;"
      - name: Run MySQL tests
        timeout-minutes: 10
        env:
          DATABASE_URL: "mysql+pymysql://mysql:mysql@127.0.0.1:${{ job.services.mysql.ports['3306'] }}/dataset?charset=utf8"
        run: uv run pytest

  # The other test jobs install uv.lock, which proves one pinned set works. A
  # user's pip resolves the declared ranges instead, so test both ends of
  # them: every direct runtime dependency at its floor on the oldest Python,
  # and at its newest on the newest. `uv pip`, not `uv lock`: the universal
  # lock only picks versions every supported Python can install, so it can
  # sit below what a newer interpreter resolves to.
  dep-ranges:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - resolution: lowest-direct
            python-version: "3.11"
          - resolution: highest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv venv
      - name: Runtime dependencies at the ${{ matrix.resolution }} end
        run: uv pip install --resolution ${{ matrix.resolution }} -r pyproject.toml
      # Tooling and drivers at their newest; without --upgrade this leaves the
      # runtime pins from the previous step alone.
      - run: uv pip install --group dev
      - run: uv pip list
      - name: Run SQLite tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
        run: uv run --no-sync pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build sdist + wheel
        run: uv build
      # git is the only distribution channel, so the packaging check that
      # matters is that `pip install git+…` on this commit imports cleanly —
      # not that the metadata would satisfy a PyPI upload. The `@<sha>` is
      # required, not decorative: actions/checkout leaves a shallow, detached
      # clone with no refs/remotes/origin/HEAD, which is what a bare
      # `git+file://…` resolves against, and it dies with "ambiguous argument".
      # The install resolves fresh (no uv.lock), as a user's pip would, and
      # with both extras: building an engine imports the driver SQLAlchemy
      # picks for the documented URL without connecting, so an extra that
      # ships a different driver than SQLAlchemy loads fails here.
      - name: Smoke-test the git install path
        run: >-
          uv run --no-project
          --with "lazyset[postgresql,mysql] @ git+file://${{ github.workspace }}@${{ github.sha }}"
          python -c "import lazyset; print(lazyset.__version__);
          lazyset.connect('postgresql://u:p@localhost/db');
          lazyset.connect('mysql+pymysql://u:p@localhost/db')"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Build API docs
        run: make docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy-docs:
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # false: a queued Pages deploy should wait, not cancel — a cancelled
    # deployment can wedge the github-pages environment.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      # Pages must already be enabled on the repo with build_type=workflow;
      # actions/configure-pages' `enablement` input cannot do it, because it
      # explicitly requires a PAT rather than the workflow's GITHUB_TOKEN.
      - id: deployment
        uses: actions/deploy-pages@v5
