[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazyset"
dynamic = ["version"]
description = "Toolkit for Python-based database access."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Friedrich Lindenberg", email = "friedrich.lindenberg@gmail.com"},
    {name = "Gregor Aisch"},
    {name = "Stefan Wehrmeyer"},
]
keywords = ["sql", "sqlalchemy", "etl", "loading", "utility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.1,<3.0",
    "alembic>=1.13.2",
]

# Extras are the *user-facing* install surface: the DBAPI driver each non-SQLite
# backend needs. Named after SQLAlchemy's own extras, since lazyset is a thin
# layer over it. There is no `sqlite` extra — that driver is in the stdlib.
[project.optional-dependencies]
# psycopg 3 is what SQLAlchemy 2.1 loads for a plain `postgresql://` URL.
# Requesting it through SQLAlchemy's own extra inherits SQLAlchemy's supported
# driver range rather than restating it here.
postgresql = ["sqlalchemy[postgresql-psycopgbinary]"]
# The `rsa` extra pulls in cryptography, which PyMySQL needs for MySQL 8's
# default caching_sha2_password auth.
mysql = ["PyMySQL[rsa]"]

# PEP 735 group: tooling for working *on* lazyset, never part of what an
# installer resolves for someone depending on it. `uv sync` installs it by
# default.
[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff>=0.16",
    "ty",
    "pdoc",
    "mutmut>=3.6.0",
    # The backend drivers are spelled out rather than pulled in as
    # `lazyset[mysql,postgresql]`. A self-referential requirement only resolves
    # to the local project under uv; anything else resolves it against PyPI,
    # where the `lazyset` name belongs to an unrelated project.
    "sqlalchemy[postgresql-psycopgbinary]",
    "PyMySQL[rsa]",
]

[project.urls]
Homepage = "https://github.com/medecau/lazyset"
Repository = "https://github.com/medecau/lazyset"
Documentation = "https://medecau.github.io/lazyset/"
Changelog = "https://github.com/medecau/lazyset/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "lazyset/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["lazyset"]

[tool.mutmut]
# mutmut otherwise guesses the source directory from the *checkout* directory
# name, which does not match the package after the dataset -> lazyset rename.
source_paths = ["lazyset"]
# test_docs.py reads README.md and docs/ next to test/, which mutmut does not
# copy into mutants/, and it chdirs into a temp dir, which breaks mutmut's
# relative source paths while collecting stats. The guides exercise the same
# code the unit tests do, so mutation scoring runs without them.
pytest_add_cli_args = ["--ignore=test/test_docs.py"]

[tool.ruff.lint]
# Using ruff's recommended default rule sets
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# Docstring `>>>` examples run on every pytest invocation rather than in a
# separate env, so an example that stops matching real output fails
# everywhere. The guides' examples are covered by `test/test_docs.py`, which
# runs each Markdown file as one session — see its module docstring.
# `testpaths` keeps a bare `pytest` out of mutmut's `mutants/` copy, which
# would otherwise be collected (and fail on import-path mismatches) after a
# mutation run.
[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["lazyset", "test"]
