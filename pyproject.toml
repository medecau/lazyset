[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazyset"
dynamic = ["version"]
description = "Toolkit for Python-based database access."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Friedrich Lindenberg", email = "friedrich.lindenberg@gmail.com"},
    {name = "Gregor Aisch"},
    {name = "Stefan Wehrmeyer"},
]
keywords = ["sql", "sqlalchemy", "etl", "loading", "utility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=0.6.2",
]

[project.optional-dependencies]
dev = [
    "pytest-cov",
    "pytest",
    "hypothesis",
    "build",
    "twine",
    "ruff",
    "mypy",
    "psycopg2-binary",
    "PyMySQL",
    "cryptography",
    "mutmut>=3.6.0",
    "pdoc",
]

[project.urls]
Homepage = "https://github.com/medecau/lazyset"
Repository = "https://github.com/medecau/lazyset"
Documentation = "https://medecau.github.io/lazyset/"
Changelog = "https://github.com/medecau/lazyset/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "lazyset/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["lazyset"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Using ruff's recommended default rule sets
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
